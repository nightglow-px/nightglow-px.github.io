<style>
  :root { --bg:#0b1020; --ink:#e8f6f0; --muted:#9fb3c8; --glow:#5ef0b0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: clamp(2rem, 6vw, 3.2rem); margin: 0 0 4px; letter-spacing: -0.02em; color: var(--glow); }
  .tag { color: var(--muted); margin: 0 0 28px; }
  figure { margin: 0 0 28px; }
  img { width: 100%; height: auto; display: block; border-radius: 10px; }
  figcaption { color: var(--muted); font-size: .95rem; margin-top: 8px; }
  a { color: var(--glow); }
  p { max-width: 62ch; }
</style>
</head>
<body>
<main>
  <h1>nightglow-px</h1>
  <p class="tag">Generative night skies. Code, cold light, long nights.</p>
  <figure>
    <img src="aurora.jpg" alt="Northern Light: aurora curtains over a needle-shaped peak, a lit cabin and a still lake" width="1920" height="1200">
    <figcaption><em>Northern Light</em>, 2026. Rendered at 1920×1200.</figcaption>
  </figure>
  <p>Every picture here starts as noise and a handful of sine waves. The generator is open source: <a href="https://github.com/nightglow-px/aurora-gen">aurora-gen on GitHub</a>.</p>
  <p>I don't sell prints here. They hang at Lumen Gallery, where I show as <strong>quiet.meridian</strong>.</p>
</main>
</body>
